name: Deploy Cloudflare Workers
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Verify deployment configuration
        run: node -e "for (const n of ['CLOUDFLARE_API_TOKEN','CLOUDFLARE_ACCOUNT_ID','SUPABASE_URL','SUPABASE_PUBLISHABLE_KEY']) if (!process.env[n]) throw new Error('Missing '+n)"
      - run: npm ci
      - run: npm run check
      - run: npx wrangler deploy
      - name: Configure Supabase runtime
        run: |
          node --input-type=module -e "import fs from 'node:fs';fs.mkdirSync('.wrangler',{recursive:true});fs.writeFileSync('.wrangler/runtime-secrets.json',JSON.stringify({SUPABASE_URL:process.env.SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY:process.env.SUPABASE_PUBLISHABLE_KEY}),{mode:0o600})"
          npx wrangler secret bulk .wrangler/runtime-secrets.json
      - name: Remove temporary runtime configuration
        if: always()
        run: node -e "require('node:fs').rmSync('.wrangler/runtime-secrets.json',{force:true})"
